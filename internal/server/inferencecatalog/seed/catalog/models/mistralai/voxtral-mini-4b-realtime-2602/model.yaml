  # The upstream realtime defects fixed on bf16-vllm-nvidia-general apply here
  # too, but the realtime patch is digest-pinned to upstream vLLM sources and
  # fails the container start on any mismatch. This image ships a vendor vLLM
  # build whose sources are unverified, so the patch is deliberately not wired
  # in until the image's vLLM files are digest-verified.
  api:
    health_endpoint: /health
    operations:
