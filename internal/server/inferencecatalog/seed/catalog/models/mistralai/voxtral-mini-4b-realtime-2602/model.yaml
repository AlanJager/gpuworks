    cc: '>=8.0'
  args:
  - --tokenizer-mode
  - mistral
  env:
    VLLM_DISABLE_COMPILE_CACHE: '1'
  # The upstream realtime endpoint drops the tail of any utterance that ends
  # without trailing silence, never starts generation for a final-only commit
  # (so no transcription.done is sent) and cancels its generation/feeder tasks
  # without awaiting them. This pre-start patch repairs the installed vLLM in
  # place; it is digest-pinned to the vLLM v0.23.0 and v0.30.0 sources, the
  # only supported releases, and fails the container start loudly on any other
  # content instead of half-patching. The runner image tags pin those two vLLM
  # releases, so any image revision that changes the vLLM sources is a hard
  # start failure by design until the patch is re-pinned to the new sources.
  assets:
  - file: assets/voxtral-realtime-patch.tar.gz
    sha256: a178cfd0b7a0749addaeb214ff0ed5e693bcdd25e1b35f99bb23d75b2045899f
    size_bytes: 3208
    unpack_to: /opt/gpuworks/voxtral-realtime-patch
  pre_start_script: python3 /opt/gpuworks/voxtral-realtime-patch/voxtral_realtime_patch.py
  api:
    health_endpoint: /health
    operations:
    - type: openai.realtime
      endpoint: /v1/realtime
      mode: realtime
