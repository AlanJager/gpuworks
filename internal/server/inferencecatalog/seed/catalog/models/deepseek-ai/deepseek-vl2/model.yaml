      def resolve(gpu):
          # Any card count whose memory holds the weights (51.2 GiB) and a KV pool
          # of 1.0 GiB, within the engine's 0.85 share less about 2 GiB of runtime
          # overhead per card. The scheduler takes the fewest such cards and keeps
          # the tensor-parallel size a divisor of the attention heads.
          if gpu.count * (gpu.min_memory_gib * 0.85 - 2) < 53:
              return reject("the weights and a minimal KV pool need 53 GiB; these cards offer less")
          if gpu.min_memory_gib < 32: return reject("each GPU requires at least 32 GiB")
          return {"GPU_COUNT": gpu.count, "TP_SIZE": gpu.count, "SP_DEGREE": 1}
