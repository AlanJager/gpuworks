    sources:
    - huggingface:
        repo_id: moonshotai/Kimi-K3.1-Pro
        revision: 6d0a0202956796543364d666ab19c6ad1a494ee1
  weight_bytes: 1561355966963
  gpus:
    vendor: ppu
    name: (?:PPU[ _-]?M890)([^A-Za-z0-9]|$)
  args:
  - --trust-remote-code
  - --enable-expert-parallel
  - --tensor-parallel-size
  - '8'
  - --all2all-backend
  - deepep_low_latency
  - --gpu-memory-utilization
  - '0.9'
  - --max-num-seqs
  - '32'
  - --disable-custom-all-reduce
  - --no-enable-prefix-caching
  - --enable-auto-tool-choice
  - --tool-call-parser
  - kimi_k3
  - --reasoning-parser
  - kimi_k3
  env:
    VLLM_ENGINE_READY_TIMEOUT_S: '3600'
    DG_USE_MOE_DYNAMIC_TILE: '1'
    VLLM_SAIL_DENSE_BF16_DEEPGEMM: '1'
    VLLM_SAIL_DEEPGEMM_MOE_TP_FUSED: '1'
    VLLM_SAIL_DEEPGEMM_MOE_FUSED_ACT_QUANT: '1'
    VLLM_DEEPEPLL_RECV_HOOK: '0'
    VLLM_DEEPEP_LOW_LATENCY_USE_MNNVL: '1'
    DEEPEP_COMBINE_TOKEN_BALANCED: '1'
  placement:
    language: starlark
    resolver: |-
      def resolve(gpu):
          # The vLLM recipe runs TP8 on every 8-PPU M890 node and one
          # data-parallel replica per node (TP8 x DP4 on four nodes), so each
          # node takes exactly 8 cards. The deployment states the data-parallel
          # degree (the node count); TP_SIZE stays the deployment's own, since
          # it counts every node's cards for multi-node placement.
          if gpu.count != 8:
              return reject("this recipe runs TP8 on exactly 8 PPUs per node")
          return {"GPU_COUNT": 8, "SP_DEGREE": 1}
  api:
    health_endpoint: /health
    operations:
    - type: openai.chat
      endpoint: /v1/chat/completions
      mode: stream
input_modalities: [text, image]
