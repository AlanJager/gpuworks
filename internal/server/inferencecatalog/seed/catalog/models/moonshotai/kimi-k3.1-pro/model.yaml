  placement:
    language: starlark
    resolver: |-
      def resolve(gpu):
          # The vLLM recipe runs TP8 on every 8-PPU M890 node and one
          # data-parallel replica per node (TP8 x DP4 on four nodes), so each
          # node takes exactly 8 cards. The deployment states the data-parallel
          # degree (the node count); TP_SIZE stays the deployment's own, since
          # it counts every node's cards for multi-node placement.
          if gpu.count != 8:
              return reject("this recipe runs TP8 on exactly 8 PPUs per node")
          return {"GPU_COUNT": 8, "SP_DEGREE": 1}
  api:
    health_endpoint: /health
    operations:
    - type: openai.chat
      endpoint: /v1/chat/completions
      mode: stream
# Upstream (vLLM-Ascend 0.30.0, "Kimi K3.1 Pro (Experimental)") publishes this
# model on Atlas 800I A3 and 950DT only as 4P4D PD disaggregation over eight
# nodes, with MooncakeConnectorV2 and per-role PP/PCP/DCP. The platform's
# vllm-ascend-mooncake PD mode carries MooncakeConnectorV1 and one node per
# role, so neither published topology can be stated here.
#
# What this profile states instead is a co-located instance over the platform's
# own multi-node shape: TP16 within a node, one pipeline stage per node
# (parallelism.Spec.Defaulted), which the engine and topology layers own. Four
# nodes reproduce upstream's Prefill parallelism (PP4 x TP4 is theirs, PP4 x
# TP16 is this one's), and two nodes are the fewest that hold 1.34 TiB of W4A8
# weights within 64 GiB x 16 per node. Upstream pins VLLM_PP_LAYER_PARTITION
# for its own PP4 stage count; a stage count the deployment chooses cannot
# carry a fixed partition, so vLLM's default split applies.
#
# Cache dtypes, block size, parsers and MLAPO come from upstream's Decode
# role, which is the role that generates: FULL_DECODE_ONLY captures decode as
# a graph and leaves prefill eager, which is what one co-located engine needs.
# The Decode-only recompute_scheduler_enable flag is omitted because a
# co-located engine rejects it. DCP, PCP and the interleave size belong to the
# separated roles and are left out with them. --tokenizer-mode, the two
# parsers and --enable-auto-tool-choice are configured together because
# upstream's FAQ requires all four for reasoning and tool calling.
#
# Memory utilisation is 0.90 rather than the Decode role's 0.80: 32 ranks put
# 42.8 GiB of weights on each 64 GiB device before any cache, where upstream's
# 64 ranks put 21.4 GiB. 0.95 and 0.98 ran out of device memory under 200K
# multi-turn load.
#
# No 950DT profile is stated: it has not been validated yet.
#
# Validated on two 910C nodes with 16 dies each, using TP16 per node and PP2
# across the nodes. Ascend multi-node runs on an accelerator RDMA or HCCS
# network, so a deployment needs one covering every node it spans.
- name: w4a8-vllm-ascend-a3-multinode-16npu
  display_name_zh_cn: 910C (A3) · INT4 W4A8 · 每节点 8 卡（16 NPU） · 多机
