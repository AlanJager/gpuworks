  # The stock vLLM Ascend image leaves its Ascend environment to the shell
  # profile, which a container command does not read, so the toolkit and the
  # ATB scripts are sourced here when the image carries them.
  entrypoint:
  - /bin/bash
  - -c
  - 'for script in /usr/local/Ascend/ascend-toolkit/set_env.sh /usr/local/Ascend/nnal/atb/set_env.sh; do [ -f "$script" ] && source "$script"; done; exec vllm serve "$@"'
  - --
  placement:
    language: starlark
    resolver: |-
      def resolve(gpu):
          # Upstream's A3 recipe uses every one of a node's 16 logical devices,
          # and the platform shares TP x PP ranks equally over the deployment's
          # nodes: TP is a node's devices and the stage count is the node count.
          if gpu.count != 16:
              return reject("the A3 recipe uses exactly 16 logical devices per node")
          if gpu.min_memory_gib < 64:
              return reject("each device requires at least 64 GiB")
          return {"GPU_COUNT": 16, "TP_SIZE": 16, "SP_DEGREE": 1}
  api:
    health_endpoint: /health
    operations:
    - type: openai.chat
      endpoint: /v1/chat/completions
      mode: stream
    metrics:
      endpoint: /metrics
      inherit: vllm
