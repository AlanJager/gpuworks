        revision: 46a050bec13002ad29ee795c16e61cf4fa3c4a9c
  weight_bytes: 328337455672
  gpus:
    vendor: amd
    name: (^|[^A-Za-z0-9])(?:MI355X)([^A-Za-z0-9]|$)
    display_target: amd
  args:
  - --max-num-seqs
  - '512'
  - --tool-call-parser
  - glm47
  - --reasoning-parser
  - glm47
  - --enable-auto-tool-choice
  - --attention-backend
  - ROCM_AITER_MLA_SPARSE
  placement:
    language: starlark
    resolver: |
      def resolve(gpu):
          if gpu.count != 4:
              return reject("this recipe requires exactly 4 GPUs per node")
          return {"TP_SIZE": 4, "SP_DEGREE": 1}
  env:
    VLLM_ROCM_USE_AITER: '1'
    VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS: '1'
    VLLM_ROCM_USE_AITER_TRITON_SPARSE_MLA: '1'
  api:
    health_endpoint: /health
    operations:
    - type: openai.chat
      endpoint: /v1/chat/completions
      mode: stream
- name: int8-vllm-ascend-a3-tp16
  display_profile: compatible
  scenario: balanced
  engine: vllm
  image: quay.io/ascend/vllm-ascend:v0.30.0rc2-a3
  weights:
    quantization: int8
    sources:
    - modelscope:
        repo_id: Eco-Tech/GLM-5.3-Flash-w8a8
        revision: fce3173cef79062469745b520c6742883e60a166
  weight_bytes: 331764803315
  gpus:
    vendor: ascend
    name: (^|[^A-Za-z0-9])910C([^A-Za-z0-9]|$)
    display_target: ascend
  args:
  - --trust-remote-code
  - --enforce-eager
  - --quantization
  - ascend
  - --data-parallel-size
  - '1'
  - --enable-expert-parallel
  - --seed
  - '1024'
  - --safetensors-load-strategy
  - prefetch
  - --max-num-seqs
  - '32'
  - --max-model-len
  - '1048576'
  - --max-num-batched-tokens
  - '8192'
  - --kv-cache-dtype
  - int8
  - --limit-mm-per-prompt
  - '{"image":1,"video":0}'
  - --gpu-memory-utilization
  - '0.92'
  - --additional-config
  - '{"multistream_overlap_shared_expert":true}'
  - --api-server-count
  - '1'
  # vLLM-Ascend #8679 leaves the NPU device context unbound around runner
  # initialization, and worker ranks can enter the upstream and Ascend group
  # phases in different orders. Patch both release-image layouts idempotently.
  env:
    VLLM_USE_V2_MODEL_RUNNER: '0'
    PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
    HCCL_OP_EXPANSION_MODE: AIV
    HCCL_BUFFSIZE: '1024'
  placement:
    language: starlark
    resolver: |
      def resolve(gpu):
          if gpu.count != 16:
              return reject("the A3 recipe requires exactly 16 logical devices")
          if gpu.min_memory_gib < 64:
              return reject("each device requires at least 64 GiB")
          return {"GPU_COUNT": gpu.count, "TP_SIZE": 16, "SP_DEGREE": 1}
  api:
    health_endpoint: /health
    operations:
    - type: openai.chat
      endpoint: /v1/chat/completions
      mode: stream
