- name: fp8-vllm-amd-mi355x-tp4
  display_profile: compatible
  scenario: balanced
  engine: vllm
  image: vllm/vllm-openai-rocm:nightly-rocm100
  weights:
    quantization: fp8
    sources:
    - huggingface:
        repo_id: zai-org/GLM-5.3-Flash
        revision: 46a050bec13002ad29ee795c16e61cf4fa3c4a9c
  weight_bytes: 328337455672
  gpus:
    vendor: amd
    name: (^|[^A-Za-z0-9])(?:MI355X)([^A-Za-z0-9]|$)
    display_target: amd
  args:
  - --max-num-seqs
  - '512'
  - --tool-call-parser
  - glm47
  - --reasoning-parser
  - glm47
  - --enable-auto-tool-choice
  - --attention-backend
  - ROCM_AITER_MLA_SPARSE
  placement:
    language: starlark
    resolver: |
      def resolve(gpu):
          if gpu.count != 4:
              return reject("this recipe requires exactly 4 GPUs per node")
          return {"TP_SIZE": 4, "SP_DEGREE": 1}
  env:
    VLLM_ROCM_USE_AITER: '1'
    VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS: '1'
    VLLM_ROCM_USE_AITER_TRITON_SPARSE_MLA: '1'
