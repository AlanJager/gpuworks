specs:
- name: fp8-sglang-nvidia-h200
  display_profile: compatible
  scenario: balanced
  engine: sglang
  image: gpuworks/gpuworks-runner:cuda13.0-sglang0.5.21-r2
  weights:
    quantization: fp8
    sources:
    - huggingface:
        repo_id: zai-org/GLM-5.3-Flash
        revision: 46a050bec13002ad29ee795c16e61cf4fa3c4a9c
  weight_bytes: 328337455672
  gpus:
    vendor: nvidia
    name: (^|[^A-Za-z0-9])(?:H200)([^A-Za-z0-9]|$)
    display_target: nvidia
  args:
  - --ep-size
  - ${TP_SIZE}
  - --mem-fraction-static
  - '0.75'
  - --dsa-prefill-backend
  - tilelang
  - --dsa-decode-backend
  - tilelang
  - --kv-cache-dtype
  - bfloat16
  - --moe-runner-backend
  - deep_gemm
  - --speculative-algorithm
  - EAGLE
  - --speculative-num-steps
  - '5'
  - --speculative-eagle-topk
  - '1'
  - --speculative-num-draft-tokens
  - '6'
  - --reasoning-parser
  - glm45
  - --tool-call-parser
  - glm47
  - --enable-metrics
  placement:
    language: starlark
    resolver: |
      def resolve(gpu):
          if gpu.count != 4 and gpu.count != 8:
              return reject("this recipe runs on 4 or 8 GPUs per node")
          return {"TP_SIZE": gpu.count, "SP_DEGREE": 1}
  api:
    health_endpoint: /health
    operations:
    - type: openai.chat
      endpoint: /v1/chat/completions
      mode: stream
