- name: bf16-sglang-ascend-36013872
  display_name_zh_cn: 910B (A2) · BF16
  display_name_en: 910B (A2) · BF16
  scenario: balanced
  engine: sglang
  image: gpuworks/gpuworks-runner:cann9.0-910b-sglang0.5.18-r2
  weights:
    quantization: bf16
    sources:
    - huggingface:
        repo_id: zai-org/GLM-4.5V
        revision: ed47433b37111465ec527affaaddceff371bca04
    - modelscope:
        repo_id: ZhipuAI/GLM-4.5V
        revision: 06ca6dd09552a83821e0422a16c051e078107066
  weight_bytes: 215446301582
  gpus:
    vendor: ascend
    name: (^|[^A-Za-z0-9])910B[A-Za-z0-9]*([^A-Za-z0-9]|$)
  args:
  - --enable-metrics
  - --trust-remote-code
  - --attention-backend
  - ascend
  - --mm-attention-backend
  - ascend_attn
  - --device
  - npu
  - --dtype
  - bfloat16
  - --enable-multimodal
  - --chat-template
  - /model/chat_template.jinja
  - --reasoning-parser
  - glm45
  - --tool-call-parser
  - glm45
  placement:
    language: starlark
    resolver: |-
      def resolve(gpu):
          # Any card count whose memory holds the weights (200.7 GiB) and a KV
          # pool of 4.0 GiB, within the engine's 0.85 share less about 2 GiB of
          # runtime overhead per card. The scheduler takes the fewest such cards
          # and keeps the tensor-parallel size a divisor of the attention heads.
          if gpu.count * (gpu.min_memory_gib * 0.85 - 2) < 205:
              return reject("the weights and a minimal KV pool need 205 GiB; these cards offer less")
          if gpu.min_memory_gib < 32: return reject("each GPU requires at least 32 GiB")
          return {"GPU_COUNT": gpu.count, "TP_SIZE": gpu.count, "SP_DEGREE": 1}
  api:
    health_endpoint: /health
    operations:
    - type: openai.chat
      endpoint: /v1/chat/completions
      mode: stream
