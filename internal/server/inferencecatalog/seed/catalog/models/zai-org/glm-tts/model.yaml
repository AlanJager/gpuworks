model_id: zai-org/glm-tts
source: upstream
display_title: GLM-TTS
parameter_count: 3B
architecture: dense
release_date: '2025-12-10'
model_config: {model_type: llama, num_hidden_layers: 28, hidden_size: 2048, num_attention_heads: 16, num_key_value_heads: 4, head_dim: 128, max_position_embeddings: 8192}
specs:
- name: bf16-vllm-nvidia-general
  display_name_zh_cn: Ampere 及以上 · BF16
  display_name_en: Ampere+ · BF16
  scenario: balanced
  engine: vllm
  image: gpuworks/gpuworks-runner:cuda13.0-vllm-omni0.30.0-r4
  weights:
    quantization: bf16
    sources:
    - huggingface:
        repo_id: zai-org/GLM-TTS
        revision: b3feb691fa4cf590eec4418f6275f95220e58844
    - modelscope:
        repo_id: ZhipuAI/GLM-TTS
        revision: 723af81da5ca966a9ebd84c552286fbeb72e9827
  weight_bytes: 8888806439
  gpus:
    vendor: nvidia
    cc: '>=8.0'
  # Voice cloning needs CosyVoice's campplus.onnx speaker encoder, which the
  # GLM-TTS repository does not ship; vLLM-Omni falls back to fetching it from
  # FunAudioLLM/CosyVoice-300M, which an offline container cannot do.
  # gpuworks/CosyVoice-300M-campplus holds that one file, unchanged (sha256
  # a6ac6a63...0f4d73), so the deployment does not pull the multi-GB CosyVoice
  # checkpoint for it; it mounts beside the weights and pre-start seeds the
  # Hugging Face cache entry vLLM-Omni looks up.
  components:
  - name: glm-tts
    role: primary
    weights:
      quantization: bf16
      sources:
      - huggingface:
          repo_id: zai-org/GLM-TTS
          revision: b3feb691fa4cf590eec4418f6275f95220e58844
      - modelscope:
          repo_id: ZhipuAI/GLM-TTS
          revision: 723af81da5ca966a9ebd84c552286fbeb72e9827
    weight_bytes: 8888806439
    mount_path: /models/GLM-TTS
  - name: campplus
    role: auxiliary
    weights:
      quantization: fp32
      sources:
      - huggingface:
          repo_id: gpuworks/CosyVoice-300M-campplus
          revision: 9920592fcd7e343aa87e13df82566571a00b8f54
      - modelscope:
          repo_id: gpuworks/CosyVoice-300M-campplus
          revision: 254c6ab413e4eb9fd1b888d4e0c4eef046f544be
    weight_bytes: 28306332
    mount_path: /models/campplus
  # vLLM-Omni picks the pipeline from a root config.json, then from the model
  # path's basename. GLM-TTS ships no root config.json, so pin the pipeline in
  # a deploy overlay that inherits the bundled glm_tts.yaml rather than rely on
  # the mount path's name.
  pre_start_script: |-
    set -e
    cat > /tmp/glm-tts-deploy.yaml <<'YAML'
    base_config: /usr/local/lib/python3.12/dist-packages/vllm_omni/deploy/glm_tts.yaml
    pipeline: glm_tts
    YAML
    hub=$(python3 -c 'from huggingface_hub import constants; print(constants.HF_HUB_CACHE)')
    rev=24c40509c3c5ea6fe06b5f8790ff99e3714a6bee
    repo="$hub/models--FunAudioLLM--CosyVoice-300M"
    mkdir -p "$repo/refs" "$repo/snapshots/$rev"
    printf '%s' "$rev" > "$repo/refs/main"
    ln -sfn /models/campplus/campplus.onnx "$repo/snapshots/$rev/campplus.onnx"
  args:
  - --omni
  - --deploy-config
  - /tmp/glm-tts-deploy.yaml
  - --trust-remote-code
  api:
    health_endpoint: /health
    operations:
    - type: openai.audio.speech
      endpoint: /v1/audio/speech
      mode: sync
      inputs:
      - name: ref_audio
        label:
          en: Reference audio
          zh: 参考音频
        kind: audio
        encoding: data_url
        required: true
      - name: ref_text
        kind: text
        required: true
- name: bf16-vllm-ppu-b3feb691
  display_name_zh_cn: PPU · BF16
  display_name_en: PPU · BF16
  scenario: balanced
  engine: vllm
  image: gpuworks/gpuworks-runner:hggc13.0-vllm0.23.0-r2
  weights:
    quantization: bf16
    sources:
    - huggingface:
        repo_id: zai-org/GLM-TTS
        revision: b3feb691fa4cf590eec4418f6275f95220e58844
    - modelscope:
        repo_id: ZhipuAI/GLM-TTS
        revision: 723af81da5ca966a9ebd84c552286fbeb72e9827
  weight_bytes: 8820923544
  gpus:
    vendor: ppu
    name: (?:PPU[ _-]?(?:ZW810E|M890)|Beethoven)
  args:
  - --omni
  - --deploy-config
  - /usr/local/lib/python3.12/site-packages/vllm_omni/deploy/glm_tts.yaml
  - --allowed-local-media-path
  - /reference
  api:
    health_endpoint: /health
    operations:
    - type: openai.audio.speech
      endpoint: /v1/audio/speech
      mode: sync
      inputs:
      - name: ref_audio
        label:
          en: Reference audio
          zh: 参考音频
        kind: audio
        encoding: data_url
        required: true
      - name: ref_text
        kind: text
        required: true
input_modalities: [text, audio]
