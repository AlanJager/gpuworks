model_id: zai-org/glm-tts
source: upstream
display_title: GLM-TTS
parameter_count: 3B
architecture: dense
release_date: '2025-12-10'
model_config: {model_type: glm_tts, num_hidden_layers: 28, hidden_size: 2048, num_attention_heads: 16, num_key_value_heads: 4, head_dim: 128, max_position_embeddings: 8192}
specs:
- name: bf16-vllm-nvidia-general
  display_profile: general
  scenario: balanced
  engine: vllm
  image: gpuworks/gpuworks-runner:cuda13.0-vllm-omni0.30.0-r3
  weights:
    quantization: bf16
    sources:
    - huggingface:
        repo_id: zai-org/GLM-TTS
        revision: b3feb691fa4cf590eec4418f6275f95220e58844
    - modelscope:
        repo_id: ZhipuAI/GLM-TTS
        revision: 723af81da5ca966a9ebd84c552286fbeb72e9827
  weight_bytes: 8888806439
  gpus:
    vendor: nvidia
    cc: '>=8.0'
    display_target: nvidia
  # The checkpoint keeps its language backbone under llm/ and has no root
  # config.json. vLLM-Omni's pipeline needs the root marker before it can
  # resolve the nested Llama weights and the stage-specific assets.
  pre_start_script: |-
    python3 - <<'PY'
    import json
    import os
    source = "/model/llm/config.json"
    target = "/tmp/glm-tts/config.json"
    os.makedirs(os.path.dirname(target), exist_ok=True)
    with open(source, encoding="utf-8") as stream:
        config = json.load(stream)
    config["architectures"] = ["GLMTTSForConditionalGeneration"]
    config["model_type"] = "glm_tts"
    config["torch_dtype"] = "bfloat16"
    with open(target, "w", encoding="utf-8") as stream:
        json.dump(config, stream, separators=(",", ":"))
    PY
  args:
  - --omni
  - --deploy-config
  - /usr/local/lib/python3.12/dist-packages/vllm_omni/deploy/glm_tts.yaml
  - --trust-remote-code
  - --hf-config-path
  - /tmp/glm-tts/config.json
  api:
    health_endpoint: /health
    operations:
    - type: openai.audio.speech
      endpoint: /v1/audio/speech
      mode: sync
      inputs:
      - name: ref_audio
        label:
          en: Reference audio
          zh: 参考音频
        kind: audio
        encoding: data_url
        required: true
      - name: ref_text
        kind: text
        required: true
- name: bf16-vllm-ppu-b3feb691
  display_profile: compatible
  scenario: balanced
  engine: vllm
  image: gpuworks/gpuworks-runner:hggc13.0-vllm0.23.0-r2
  weights:
    quantization: bf16
    sources:
    - huggingface:
        repo_id: zai-org/GLM-TTS
        revision: b3feb691fa4cf590eec4418f6275f95220e58844
    - modelscope:
        repo_id: ZhipuAI/GLM-TTS
        revision: 723af81da5ca966a9ebd84c552286fbeb72e9827
  weight_bytes: 8820923544
  gpus:
    vendor: ppu
    name: (?:PPU[ _-]?(?:ZW810E|M890)|Beethoven)
    display_target: ppu
  args:
  - --omni
  - --deploy-config
  - /usr/local/lib/python3.12/site-packages/vllm_omni/deploy/glm_tts.yaml
  - --allowed-local-media-path
  - /reference
  api:
    health_endpoint: /health
    operations:
    - type: openai.audio.speech
      endpoint: /v1/audio/speech
      mode: sync
      inputs:
      - name: ref_audio
        label:
          en: Reference audio
          zh: 参考音频
        kind: audio
        encoding: data_url
        required: true
      - name: ref_text
        kind: text
        required: true
input_modalities: [text, audio]
