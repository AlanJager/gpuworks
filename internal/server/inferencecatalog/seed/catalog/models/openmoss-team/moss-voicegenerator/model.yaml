model_id: openmoss-team/moss-voicegenerator
source: upstream
display_title: MOSS-VoiceGenerator
parameter_count: 1.7B
architecture: dense
release_date: '2026-02-08'
model_config: {model_type: moss_tts_delay, num_hidden_layers: 28, hidden_size: 2048, num_attention_heads: 16, num_key_value_heads: 8, head_dim: 128, max_position_embeddings: 40960, layer_types: [full_attention, full_attention, full_attention, full_attention, full_attention, full_attention, full_attention, full_attention, full_attention, full_attention, full_attention, full_attention, full_attention, full_attention, full_attention, full_attention, full_attention, full_attention, full_attention, full_attention, full_attention, full_attention, full_attention, full_attention, full_attention, full_attention, full_attention, full_attention]}
specs:
- name: bf16-vllm-nvidia-general
  display_name_zh_cn: Ampere 及以上 · BF16
  display_name_en: Ampere+ · BF16
  scenario: balanced
  engine: vllm
  image: gpuworks/gpuworks-runner:cuda13.0-vllm-omni0.30.0-r4
  weights:
    quantization: bf16
    sources:
    - huggingface:
        repo_id: OpenMOSS-Team/MOSS-VoiceGenerator
        revision: 97521ec2b6f3ec5026ac1f5751f8fc302d82c2d4
    - modelscope:
        repo_id: openmoss/MOSS-VoiceGenerator
        revision: ede6f086ff30ae94c464b68951b5942fc7818fc7
  weight_bytes: 4244249582
  gpus:
    vendor: nvidia
    cc: '>=8.0'
  entrypoint:
  - /bin/sh
  - -c
  - |
    shift
    exec vllm serve /tmp/MOSS-VoiceGenerator "$@"
  - moss-voicegenerator
  pre_start_script: |-
    set -e
    src=/models/MOSS-VoiceGenerator
    dst=/tmp/MOSS-VoiceGenerator
    mkdir -p "$dst"
    for item in "$src"/*; do ln -sfn "$item" "$dst/$(basename "$item")"; done
    rm -f "$dst/processing_moss_tts.py"
    cp "$src/processing_moss_tts.py" "$dst/processing_moss_tts.py"
    sed -i 's#OpenMOSS-Team/MOSS-Audio-Tokenizer#/models/moss-audio-tokenizer#g' "$dst/processing_moss_tts.py"
  components:
  - name: moss-voicegenerator
    role: primary
    weights:
      quantization: bf16
      sources:
      - huggingface:
          repo_id: OpenMOSS-Team/MOSS-VoiceGenerator
          revision: 97521ec2b6f3ec5026ac1f5751f8fc302d82c2d4
      - modelscope:
          repo_id: openmoss/MOSS-VoiceGenerator
          revision: ede6f086ff30ae94c464b68951b5942fc7818fc7
    weight_bytes: 4244249582
    mount_path: /models/MOSS-VoiceGenerator
  - name: moss-audio-tokenizer
    role: auxiliary
    weights:
      quantization: fp32
      sources:
      - huggingface:
          repo_id: OpenMOSS-Team/MOSS-Audio-Tokenizer
          revision: 3cd226ba2947efa357ef453bcad111b6eafba782
      - modelscope:
          repo_id: openmoss/MOSS-Audio-Tokenizer
          revision: 1b3b842480c8fc415f373642fe78d896edc8a76d
    weight_bytes: 7101115998
    mount_path: /models/moss-audio-tokenizer
  args:
  - --omni
  - --trust-remote-code
  - --deploy-config
  - /usr/local/lib/python3.12/dist-packages/vllm_omni/deploy/moss_voice_generator.yaml
  - --hf-overrides
  - '{"codec_model_name_or_path":"/models/moss-audio-tokenizer"}'
  - --gpu-memory-utilization
  - '0.75'
  - --enforce-eager
  api:
    health_endpoint: /health
    operations:
    - type: openai.audio.speech
      endpoint: /v1/audio/speech
      mode: sync
      inputs:
      - name: instructions
        kind: text
        required: true
        label:
          en: Voice instructions
          zh: 音色描述
      - name: ref_audio
        label:
          en: Reference audio
          zh: 参考音频
        kind: audio
        encoding: data_url
        required: true
input_modalities: [text, audio]
