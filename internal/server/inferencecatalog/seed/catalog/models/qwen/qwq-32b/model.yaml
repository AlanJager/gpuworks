        revision: 28ad6fabf7ab80385155c45ef035df5e24a44550
  weight_bytes: 43443975837
  gpus:
    vendor: ascend
    name: (^|[^A-Za-z0-9])910C[A-Za-z0-9]*([^A-Za-z0-9]|$)
  args:
  - --enable-metrics
  - --trust-remote-code
  - --attention-backend
  - ascend
  - --device
  - npu
  - --dtype
  - bfloat16
  - --quantization
  - modelslim
  - --reasoning-parser
  - deepseek-r1
  # The validated run kept the mounted checkpoint offline.
  env:
    HF_HUB_OFFLINE: '1'
    TRANSFORMERS_OFFLINE: '1'
  # SGLang 0.5.18's ModelSlim RMSNorm wrapper lacks the optional quant_linear
  # keyword that Qwen2 passes, so model construction raises TypeError. Add
  # the keyword idempotently, and stop with a clear error if the runner source
  # no longer has the anchor line instead of failing later inside SGLang.
  pre_start_script: |
    f=/sgl-workspace/sglang/python/sglang/srt/layers/quantization/modelslim/modelslim.py
    if ! grep -Fq 'quant_linear: Optional[nn.Module] = None,' "$f"; then
      sed -i '/post_residual_addition: Optional\[torch.Tensor\] = None,/a\        quant_linear: Optional[nn.Module] = None,' "$f"
    fi
    if ! grep -Fq 'quant_linear: Optional[nn.Module] = None,' "$f"; then
      echo "ModelSlim quant_linear compatibility patch did not apply to $f" >&2
      exit 1
    fi
  placement:
    language: starlark
    resolver: "def resolve(gpu):\n    if gpu.count != 2: return reject(\"the validated\
      \ recipe runs two devices\")\n    if gpu.min_memory_gib < 32: return reject(\"\
      each GPU requires at least 32 GiB\")\n    return {\"GPU_COUNT\": 2, \"TP_SIZE\"\
      : 2, \"SP_DEGREE\": 1}\n"
  api:
    health_endpoint: /health
    operations:
    - type: openai.chat
      endpoint: /v1/chat/completions
      mode: stream
