- name: int8-sglang-ascend-7d129784
  display_profile: general
  scenario: balanced
  engine: sglang
  image: gpuworks/gpuworks-runner:cann9.0-910b-sglang0.5.18-r2
  weights:
    quantization: int8
    sources:
    - modelscope:
        repo_id: vllm-ascend/Qwen3-Next-80B-A3B-Instruct-W8A8
        revision: 850aaae5f21256a059c8f81aba812b382207a1be
  weight_bytes: 84900794893
  gpus:
    vendor: ascend
    name: (^|[^A-Za-z0-9])910B[A-Za-z0-9]*([^A-Za-z0-9]|$)
    display_target: ascend
  args:
  - --enable-metrics
  - --trust-remote-code
  - --attention-backend
  - ascend
  - --device
  - npu
  - --quantization
  - modelslim
  # NPU graph capture stalled beyond ten minutes in the earlier run; eager mode
  # completed startup and a real chat request on four 910C dies.
  - --disable-cuda-graph
  env:
    GDN_ATTN_BACKEND_TRITON: '1'
  placement:
    language: starlark
    resolver: "def resolve(gpu):\n    if gpu.count < 4: return reject(\"at least 4\
      \ GPUs are required\")\n    if gpu.min_memory_gib < 32: return reject(\"each\
      \ GPU requires at least 32 GiB\")\n    return {\"GPU_COUNT\": gpu.count, \"\
      TP_SIZE\": gpu.count, \"SP_DEGREE\": 1}\n"
  api:
    health_endpoint: /health
    operations:
    - type: openai.chat
      endpoint: /v1/chat/completions
      mode: stream
