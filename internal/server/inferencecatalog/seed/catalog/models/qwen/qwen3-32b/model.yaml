  weights:
    quantization: int8
    sources:
    - modelscope:
        repo_id: vllm-ascend/Qwen3-32B-W8A8
        revision: 9ecdf711a9629fbf2385b17b47359c8a604e39ed
  weight_bytes: 42773389808
  gpus:
    vendor: ascend
    name: (^|[^A-Za-z0-9])910B[A-Za-z0-9]*([^A-Za-z0-9]|$)
  args:
  - --quantization
  - ascend
  - --trust-remote-code
  - --distributed-executor-backend
  - mp
  - --max-num-batched-tokens
  - '40960'
  - --gpu-memory-utilization
  - '0.9'
  - --enable-auto-tool-choice
  - --tool-call-parser
  - hermes
  - --reasoning-parser
  - qwen3
  - --compilation-config
  - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
  env:
    HCCL_OP_EXPANSION_MODE: AIV
    PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
  placement:
    language: starlark
    resolver: |-
      def resolve(gpu):
          # Any card count whose memory holds the weights (39.8 GiB) and the KV
          # cache of one 40K-token request (10.0 GiB), which vLLM checks at start,
          # within the engine's 0.9 share less about 2 GiB of runtime overhead per
          # card. The scheduler takes the fewest such cards and keeps the tensor-
          # parallel size a divisor of the attention heads.
          if gpu.count * (gpu.min_memory_gib * 0.9 - 2) < 50:
              return reject("the weights and one 40K-token request need 50 GiB; these cards offer less")
          if gpu.min_memory_gib < 32: return reject("each device requires at least 32 GiB")
          return {"GPU_COUNT": gpu.count, "TP_SIZE": gpu.count, "SP_DEGREE": 1}
  api:
    health_endpoint: /health
    operations:
    - type: openai.chat
      endpoint: /v1/chat/completions
      mode: stream
