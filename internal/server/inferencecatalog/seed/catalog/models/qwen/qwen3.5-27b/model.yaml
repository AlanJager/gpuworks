- name: int8-sglang-ascend-3146b95f
  display_name_zh_cn: 910B (A2) · INT8 W8A8
  display_name_en: 910B (A2) · INT8 W8A8
  scenario: balanced
  engine: sglang
  image: gpuworks/gpuworks-runner:cann9.0-910b-sglang0.5.18-r2
  weights:
    quantization: int8
    sources:
    - huggingface:
        repo_id: KingsonHO/Qwen3.5-27B-w8a8-mtp
        revision: f2a1b462f6f204f53541caeb98698cce2297dc31
    - modelscope:
        repo_id: Eco-Tech/Qwen3.5-27B-w8a8-mtp
        revision: 357103a3e72f590694fe9cc18404bb1f7d6b7c06
  weight_bytes: 36443636800
  gpus:
    vendor: ascend
    name: (^|[^A-Za-z0-9])910B[A-Za-z0-9]*([^A-Za-z0-9]|$)
  args:
  - --enable-metrics
  - --attention-backend
  - ascend
  - --mm-attention-backend
  - ascend_attn
  - --device
  - npu
  - --dtype
  - bfloat16
  - --mamba-ssm-dtype
  - bfloat16
  - --quantization
  - modelslim
  - --trust-remote-code
  - --reasoning-parser
  - qwen3
  - --tool-call-parser
  - qwen3_coder
  env:
    GDN_ATTN_BACKEND_TRITON: '1'
  placement:
    language: starlark
    resolver: |-
      def resolve(gpu):
          # Any card count whose memory holds the weights (33.9 GiB) and a KV pool
          # of 4.0 GiB, within the engine's 0.85 share less about 2 GiB of runtime
          # overhead per card. The scheduler takes the fewest such cards and keeps
          # the tensor-parallel size a divisor of the attention heads.
          if gpu.count * (gpu.min_memory_gib * 0.85 - 2) < 38:
              return reject("the weights and a minimal KV pool need 38 GiB; these cards offer less")
          if gpu.min_memory_gib < 32: return reject("each GPU requires at least 32 GiB")
          return {"GPU_COUNT": gpu.count, "TP_SIZE": gpu.count, "SP_DEGREE": 1}
  api:
    health_endpoint: /health
    operations:
    - type: openai.chat
      endpoint: /v1/chat/completions
      mode: stream
