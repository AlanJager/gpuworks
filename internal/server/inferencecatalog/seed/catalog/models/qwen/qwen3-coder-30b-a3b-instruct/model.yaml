  placement:
    language: starlark
    resolver: |-
      def resolve(gpu):
          # Any card count whose memory holds the weights (56.9 GiB) and the KV
          # cache of one 256K-token request (24.0 GiB), which vLLM checks at
          # start, within the engine's 0.9 share less about 2 GiB of runtime
          # overhead per card. The scheduler takes the fewest such cards and keeps
          # the tensor-parallel size a divisor of the attention heads.
          if gpu.count * (gpu.min_memory_gib * 0.9 - 2) < 81:
              return reject("the weights and one 256K-token request need 81 GiB; these cards offer less")
          if gpu.min_memory_gib < 32: return reject("each GPU requires at least 32 GiB")
          return {"GPU_COUNT": gpu.count, "TP_SIZE": gpu.count, "SP_DEGREE": 1}
