        revision: acf8b6927563db989512429b9e3b500a0ab17090
    - modelscope:
        repo_id: Eco-Tech/Qwen3.5-122B-A10B-w8a8-mtp
        revision: e2622762e5d36e6558281d7810c430f9154c1f4a
  weight_bytes: 134131212322
  gpus:
    vendor: ascend
    name: (^|[^A-Za-z0-9])910B[A-Za-z0-9]*([^A-Za-z0-9]|$)
  args:
  - --quantization
  - ascend
  - --dtype
  - bfloat16
  - --trust-remote-code
  - --enable-auto-tool-choice
  - --tool-call-parser
  - qwen3_coder
  - --reasoning-parser
  - qwen3
  - --mm-encoder-tp-mode
  - data
  env:
    GLOO_SOCKET_IFNAME: lo
    HCCL_SOCKET_IFNAME: lo
    TP_SOCKET_IFNAME: lo
  placement:
    language: starlark
    resolver: |-
      def resolve(gpu):
          # Any card count whose memory holds the weights (124.9 GiB) and the KV
          # cache of one 256K-token request (6.0 GiB), which vLLM checks at start,
          # within the engine's 0.9 share less about 2 GiB of runtime overhead per
          # card. The scheduler takes the fewest such cards and keeps the tensor-
          # parallel size a divisor of the attention heads.
          if gpu.count * (gpu.min_memory_gib * 0.9 - 2) < 131:
              return reject("the weights and one 256K-token request need 131 GiB; these cards offer less")
          if gpu.min_memory_gib < 32: return reject("each GPU requires at least 32 GiB")
          return {"GPU_COUNT": gpu.count, "TP_SIZE": gpu.count, "SP_DEGREE": 1}
  api:
    health_endpoint: /health
    operations:
    - type: openai.chat
      endpoint: /v1/chat/completions
      mode: stream
