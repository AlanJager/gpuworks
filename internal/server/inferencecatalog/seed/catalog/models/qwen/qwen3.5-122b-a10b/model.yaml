- name: int8-vllm-ascend-631c173c
  display_name_zh_cn: 910B (A2) · INT8 W8A8
  display_name_en: 910B (A2) · INT8 W8A8
  scenario: balanced
  engine: vllm
  image: gpuworks/gpuworks-runner:cann9.1-910b-vllm0.26.0rc1-r2
  weights:
