# 950DT serves this model from W4A4-MXFP4 weights across 8 devices with expert
# parallelism, where the A3 profile above uses W8A8-MTP across 16. The two are
# different quantizations with different parallel shapes, so neither recipe can
# stand in for the other. No 950DT hardware was available, so these arguments
# are the published recipe, not a measured one.
- name: mxfp4-vllm-ascend-950dt-446ef8e9
  display_name_zh_cn: 950DT · MXFP4 · 投机解码
  display_name_en: 950DT · MXFP4 · Speculative
  scenario: balanced
  engine: vllm
  image: gpuworks/gpuworks-runner:cann9.2-950-vllm0.30.0rc2-r1
  weights:
    quantization: mxfp4
    sources:
    - modelscope:
        repo_id: Eco-Tech/Qwen3.5-397B-A17B-w4a4-mxfp4
        revision: 446ef8e99564a9c2d0b9fd69a6b2f38cfa3b4428
  weight_bytes: 231855876735
  gpus:
    vendor: ascend
    name: (^|[^A-Za-z0-9])950DT([^A-Za-z0-9]|$)
  args:
  - --distributed-executor-backend
  - mp
  - --enable-expert-parallel
  - --seed
  - '1024'
  - --quantization
  - ascend
  - --max-num-seqs
  - '128'
  - --max-model-len
  - '133000'
  - --max-num-batched-tokens
  - '8192'
  - --trust-remote-code
  - --enable-prefix-caching
  - --gpu-memory-utilization
  - '0.90'
  - --async-scheduling
  - --enable-auto-tool-choice
  - --tool-call-parser
  - qwen3_coder
  - --reasoning-parser
  - qwen3
  - --mm-encoder-tp-mode
  - data
  - --speculative-config
  - '{"method":"qwen3_5_mtp","num_speculative_tokens":3}'
  - --compilation-config
  - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
  - --additional-config
  - '{"enable_cpu_binding":true,"enable_fused_mc2":1,"enable_flashcomm1":true}'
  env:
    HCCL_BUFFSIZE: '400'
    HCCL_INTRA_ROCE_ENABLE: '0'
    HCCL_OP_EXPANSION_MODE: AIV
    VLLM_ASCEND_ENABLE_PREFETCH_MLP: '1'
    VLLM_USE_V2_MODEL_RUNNER: '0'
  placement:
    language: starlark
    resolver: |-
      def resolve(gpu):
          # Any card count whose memory holds the weights (215.9 GiB) and the KV
          # cache of one 133000-token request (3.8 GiB), which vLLM checks at
          # start, within the engine's 0.9 share less about 2 GiB of runtime
          # overhead per card. The scheduler takes the fewest such cards and keeps
          # the tensor-parallel size a divisor of the attention heads.
          if gpu.count * (gpu.min_memory_gib * 0.9 - 2) < 220:
              return reject("the weights and one 133000-token request need 220 GiB; these cards offer less")
          if gpu.min_memory_gib < 96: return reject("each device requires at least 96 GiB")
          return {"GPU_COUNT": gpu.count, "TP_SIZE": gpu.count, "SP_DEGREE": 1}
  api:
    health_endpoint: /health
    operations:
    - type: openai.chat
      endpoint: /v1/chat/completions
      mode: stream
