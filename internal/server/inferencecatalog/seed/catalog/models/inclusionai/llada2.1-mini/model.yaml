model_id: inclusionai/llada2.1-mini
source: upstream
display_title: Llada2.1 Mini
release_date: '2026-02-09'
model_config: {model_type: llada2_moe, num_hidden_layers: 20, hidden_size: 2048, num_attention_heads: 16, num_key_value_heads: 4, head_dim: 128, max_position_embeddings: 32768, sliding_window: 4096}
kv_bytes_per_token:
  vllm: 40960
  sglang: 40960
specs:
- name: bf16-sglang-nvidia-general
  display_name_zh_cn: Ampere 及以上 · BF16
  display_name_en: Ampere+ · BF16
  scenario: balanced
  engine: sglang
  image: gpuworks/gpuworks-runner:cuda13.0-sglang0.5.21-r2
  weights:
    quantization: bf16
    sources:
    - huggingface:
        repo_id: inclusionAI/LLaDA2.1-mini
        revision: 20e64e2ad21644d0e5248586ed9c942cdd45de0f
    - modelscope:
        repo_id: inclusionAI/LLaDA2.1-mini
        revision: 868c5f1d98c21b29e53fee5cb952116eecadff91
  weight_bytes: 32522219389
  gpus:
    vendor: nvidia
    cc: '>=8.0'
  env:
    # FlashInfer's DeepSeek fused-top-k kernel starts at compute capability 9.0.
    # A100 uses SGLang's bit-exact JIT router instead.
    SGLANG_OPT_USE_JIT_KERNEL_GROUPED_TOPK: '1'
  args:
  - --enable-metrics
  - --dllm-algorithm
  - JointThreshold
  - --trust-remote-code
  - --attention-backend
  - flashinfer
  # Decode CUDA graph stays on, capped at batch 8; prefill graph capture is
  # disabled because it does not fit beside the KV pool on 24 GiB cards, which
  # this profile (cc >= 8.0) also serves (issue #35). Both are memory limits,
  # not a model incompatibility. Runner cuda13.0-sglang0.5.21-r2 (SGLang
  # 0.5.21), TP2, --mem-fraction-static 0.88, JIT grouped-top-k router above.
  #
  # Prefill graph (default backend: breakable), with
  # --cuda-graph-backend-prefill left unset:
  # - 2x RTX 3090, 2026-11-19: about 2.27 GiB per GPU is left after the KV
  #   pool (1.84 GiB at capture begin). Capture fails on the 17th of 50 token
  #   buckets (num_tokens=704) inside graph.capture_end() with
  #   "CUDA error: out of memory"; 2 of 2 launches exited. The
  #   "num_active_captures_ > 0 INTERNAL ASSERT FAILED" printed after it is
  #   raised once capture_end() has already failed; the OOM is the cause.
  # - 2x H20-3e, 2026-11-24: 16.12 GiB per GPU is left after the KV pool. All
  #   58 buckets capture, keeping 1.24 GiB, and the server answers; 2 of 2
  #   launches. With --mem-fraction-static 0.98 (2.21 GiB left, 1.41 GiB at
  #   capture begin) the first bucket (num_tokens=8192) fails with
  #   torch.OutOfMemoryError; 1 of 1.
  # Re-check after an SGLang/torch bump on a 24 GiB card: launch once without
  # --cuda-graph-backend-prefill disabled.
  #
  # Decode graph: capped with --cuda-graph-max-bs-decode 8, which captures in
  # 0.58 GiB. Uncapped, capture covers batch sizes up to 256 and runs out of
  # memory at bs=248 with 15.35 GiB free at capture begin (2x H20-3e,
  # 2026-11-24, 1 of 1). Do not re-add --disable-cuda-graph: it resolves the
  # decode backend to disabled as well, so the two flags below would do
  # nothing (checked on the same runner). Re-check before raising the cap.
  - --cuda-graph-backend-prefill
  - disabled
  - --cuda-graph-max-bs-decode
  - '8'
  performance_tradeoffs:
  - param: --cuda-graph-backend-prefill
    reason: memory_fit
    detail_en: "Prefill graph capture does not fit beside the KV pool on a 24 GiB card: on 2x RTX 3090 (SGLang 0.5.21, TP2, about 2.27 GiB left per GPU) 2 of 2 launches ran out of memory during capture. On 2x H20-3e with 16.12 GiB left per GPU it captures in 1.24 GiB and serves."
    detail_zh: "prefill 图捕获在 24 GiB 卡上放不进 KV 池之外的余量：2 张 RTX 3090（SGLang 0.5.21，TP2，每卡约剩 2.27 GiB）上 2/2 在捕获时显存不足退出。2 张 H20-3e 每卡剩 16.12 GiB 时可以捕获（占 1.24 GiB）并正常服务。"
  - param: --cuda-graph-max-bs-decode
    reason: memory_fit
    detail_en: "Uncapped decode graph capture covers batch sizes up to 256 and ran out of memory at batch 248 on 2x H20-3e with 15.35 GiB free per GPU (SGLang 0.5.21, TP2). Capped at 8 it captures in 0.58 GiB."
    detail_zh: "decode 图不设上限时要捕获到批大小 256，在 2 张 H20-3e 上（SGLang 0.5.21，TP2，每卡余量 15.35 GiB）捕获到批大小 248 时显存不足。上限设为 8 时捕获只占 0.58 GiB。"
  api:
    health_endpoint: /health
    operations:
    - type: openai.chat
      endpoint: /v1/chat/completions
      mode: stream
input_modalities: [text]
