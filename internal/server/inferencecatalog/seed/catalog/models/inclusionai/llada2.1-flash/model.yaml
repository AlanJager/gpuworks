model_id: inclusionai/llada2.1-flash
source: upstream
display_title: Llada2.1 Flash
release_date: '2026-02-09'
model_config: {model_type: llada2_moe, num_hidden_layers: 32, hidden_size: 4096, num_attention_heads: 32, num_key_value_heads: 4, head_dim: 128, max_position_embeddings: 32768, sliding_window: 4096}
kv_bytes_per_token:
  vllm: 65536
  sglang: 65536
specs:
- name: bf16-sglang-nvidia-general
  display_name_zh_cn: Ampere 及以上 · BF16
  display_name_en: Ampere+ · BF16
  scenario: balanced
  engine: sglang
  image: gpuworks/gpuworks-runner:cuda13.0-sglang0.5.21-r2
  weights:
    quantization: bf16
    sources:
    - huggingface:
        repo_id: inclusionAI/LLaDA2.1-flash
        revision: 2bf95e86ade33c1adb5c1e223b7db2a76dc3bdd6
    - modelscope:
        repo_id: inclusionAI/LLaDA2.1-flash
        revision: 790df97cf83203f59a1475f930dada828d832215
  weight_bytes: 205792389995
  gpus:
    vendor: nvidia
    cc: '>=8.0'
  env:
    # FlashInfer's DeepSeek fused-top-k kernel starts at compute capability 9.0.
    # A100 uses SGLang's bit-exact JIT router instead.
    SGLANG_OPT_USE_JIT_KERNEL_GROUPED_TOPK: '1'
  args:
  - --enable-metrics
  - --dllm-algorithm
  - JointThreshold
  - --trust-remote-code
  - --attention-backend
  - flashinfer
  - --disable-cuda-graph
  api:
    health_endpoint: /health
    operations:
    - type: openai.chat
      endpoint: /v1/chat/completions
      mode: stream
input_modalities: [text]
