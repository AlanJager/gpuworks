specs:
- name: bf16-vllm-kunlun-p800
  display_profile: general
  scenario: balanced
  engine: vllm
  image: registry.zstack.ai/gpuworks/gpuworks-runner@sha256:33d94768ff9a895bdc8874cae09940aede1b0e88218e52ed52231b8f86a91beb
  weights:
    quantization: bf16
    sources:
    - huggingface:
        repo_id: Qwen/Qwen3.8-27B
        revision: 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0
  weight_bytes: 55586114863
  gpus:
    vendor: kunlunxin
    name: ^P800 PCIe$
    display_target: kunlunxin
  pre_start_script: |
    set -eu
    if [ "${NNODES}" -gt 1 ]; then
        : "${BKCL_RDMA_NICS:?set BKCL_RDMA_NICS to the verified RDMA netdev list for this node}"
        if [ -z "${GLOO_SOCKET_IFNAME:-}" ] || [ "$GLOO_SOCKET_IFNAME" = lo ]; then
            echo "Kunlun multi-node inference requires a selected compute network" >&2
            exit 1
        fi
        export BKCL_ENABLE_XDR=1 BKCL_RDMA_VERBS=1 BKCL_ENABLE_IBGDA=0
        export BKCL_SOCKET_IFNAME="$GLOO_SOCKET_IFNAME"
    else
        # Local TP must not inherit the image build interface (eth0).
        # This BKCL version excludes lo; discover an active host interface.
        unset BKCL_SOCKET_IFNAME
    fi
    unset XPU_VISIBLE_DEVICES
    export CUDA_VISIBLE_DEVICES=${LOCAL_VISIBLE_DEVICES}
  entrypoint:
  - /opt/vllm025-venv/bin/vllm
  - serve
  args:
  - --dtype
  - float16
  - --max-model-len
  - '2048'
  - --max-num-seqs
  - '1'
  - --max-num-batched-tokens
  - '256'
  - --gpu-memory-utilization
  - '0.7'
  - --enforce-eager
  - --enable-chunked-prefill
  - --no-enable-prefix-caching
  - --language-model-only
  env:
    BKCL_CHECK_AW: '0'
  placement:
    language: starlark
    resolver: |
      def resolve(gpu):
          if gpu.min_memory_gib < 90: return reject("requires 96 GiB P800 cards")
          if gpu.count == 1: return {"LOCAL_VISIBLE_DEVICES": "0"}
          if gpu.count == 2: return {"LOCAL_VISIBLE_DEVICES": "0,1"}
          if gpu.count == 4: return {"LOCAL_VISIBLE_DEVICES": "0,1,2,3"}
          if gpu.count == 8: return {"LOCAL_VISIBLE_DEVICES": "0,1,2,3,4,5,6,7"}
          return reject("requires 1, 2, 4 or 8 whole P800 GPUs per node")
  api:
    health_endpoint: /health
    operations:
    - type: openai.chat
      endpoint: /v1/chat/completions
      mode: stream
