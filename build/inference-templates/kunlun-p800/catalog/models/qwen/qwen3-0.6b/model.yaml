model_id: qwen/qwen3-0.6b
source: user
display_title: Qwen3-0.6B · Kunlun P800
model_config:
  model_type: qwen3
  num_hidden_layers: 28
  hidden_size: 1024
  num_attention_heads: 16
  num_key_value_heads: 8
  head_dim: 128
  max_position_embeddings: 40960
kv_bytes_per_token:
  vllm: 114688
  sglang: 114688
input_modalities:
- text
specs:
- name: bf16-vllm-kunlun-p800
  display_profile: general
  scenario: balanced
  engine: vllm
  image: registry.zstack.ai/gpuworks/gpuworks-runner@sha256:47b3f487c3bfa2151116f30c518406aa107ba1c519a3a4624d815a2d571f723c
  weights:
    quantization: bf16
    sources:
    - huggingface:
        repo_id: Qwen/Qwen3-0.6B
        revision: c1899de289a04d12100db370d81485cdf75e47ca
  weight_bytes: 1519209243
  gpus:
    vendor: kunlunxin
    name: ^P800 PCIe$
    display_target: kunlunxin
  pre_start_script: |
    set -eu
    if [ "${NNODES}" -gt 1 ]; then
        : "${BKCL_RDMA_NICS:?set BKCL_RDMA_NICS to the verified RDMA netdev list for this node}"
        if [ -z "${GLOO_SOCKET_IFNAME:-}" ] || [ "$GLOO_SOCKET_IFNAME" = lo ]; then
            echo "Kunlun multi-node inference requires a selected compute network" >&2
            exit 1
        fi
        export BKCL_ENABLE_XDR=1 BKCL_RDMA_VERBS=1 BKCL_ENABLE_IBGDA=0
        export BKCL_SOCKET_IFNAME="$GLOO_SOCKET_IFNAME"
    else
        # Local TP must not inherit the image build interface (eth0).
        # This BKCL version excludes lo; discover an active host interface.
        unset BKCL_SOCKET_IFNAME
    fi
    unset XPU_VISIBLE_DEVICES
    export CUDA_VISIBLE_DEVICES=${LOCAL_VISIBLE_DEVICES}
  entrypoint:
  - /opt/vllm025-venv/bin/vllm
  - serve
  args:
  - --dtype
  - float16
  - --max-model-len
  - '2048'
  - --max-num-seqs
  - '1'
  - --max-num-batched-tokens
  - '256'
  - --gpu-memory-utilization
  - '0.7'
  - --enforce-eager
  - --enable-chunked-prefill
  - --no-enable-prefix-caching
  env:
    BKCL_CHECK_AW: '0'
  placement:
    language: starlark
    resolver: |
      def resolve(gpu):
          if gpu.min_memory_gib < 90: return reject("requires 96 GiB P800 cards")
          if gpu.count == 1: return {"LOCAL_VISIBLE_DEVICES": "0"}
          if gpu.count == 2: return {"LOCAL_VISIBLE_DEVICES": "0,1"}
          if gpu.count == 4: return {"LOCAL_VISIBLE_DEVICES": "0,1,2,3"}
          if gpu.count == 8: return {"LOCAL_VISIBLE_DEVICES": "0,1,2,3,4,5,6,7"}
          return reject("requires 1, 2, 4 or 8 whole P800 GPUs per node")
  api:
    health_endpoint: /health
    operations:
    - type: openai.chat
      endpoint: /v1/chat/completions
      mode: stream
