  - -m
  - sglang.launch_server
  gpus:
    vendor: amd
    name: ^.*[Mm][Ii]300[Xx].*$
    arch_id: gfx942
  args:
  - --dtype
  - bfloat16
  placement:
    language: starlark
    resolver: "def resolve(gpu):\n    if gpu.count not in [1, 2, 4, 8]: return reject(\"\
      supported TP counts: 1, 2, 4, 8\")\n    return {\"GPU_COUNT\": gpu.count, \"\
      TP_SIZE\": gpu.count}\n"
  seed_spec: bf16-sglang-nvidia-general
  display_name_zh_cn: BF16 · SGLang · AMD MI300X
