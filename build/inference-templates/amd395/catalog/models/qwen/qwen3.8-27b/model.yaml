model_id: qwen/qwen3.8-27b
specs:
- name: bf16-vllm-amd395-gfx1151-local
  scenario: balanced
  engine: vllm
  image: __AMD395_VLLM_IMAGE_MAPPING_REQUIRED__:required
  gpus:
    vendor: amd
    name: ([Rr][Aa][Dd][Ee][Oo][Nn] 8060[Ss]|[Rr][Yy][Zz][Ee][Nn] [Aa][Ii] [Mm][Aa][Xx]\+?
      395|[Gg][Pp][Uu] 0[xX]1586 \([Gg][Ff][Xx]1151\))
    arch_id: gfx1151
  entrypoint:
  - vllm
  - serve
  args:
  - --dtype
  - bfloat16
  - --max-model-len
  - '4096'
  - --max-num-seqs
  - '1'
  - --gpu-memory-utilization
  - '0.75'
  - --enforce-eager
  env:
    VLLM_ROCM_USE_AITER: '0'
  placement:
    language: starlark
    resolver: "def resolve(gpu):\n    if gpu.vendor != \"amd\" or gpu.count != 1 or\
      \ len(gpu.names) != 1: return reject(\"requires one AMD gfx1151-family GPU\"\
      )\n    name = gpu.names[0]\n    aliases = [\"radeon 8060s\", \"ryzen ai max+\
      \ 395\", \"ryzen ai max 395\", \"gfx1151\"]\n    uppercase = {\"a\":\"A\",\"\
      b\":\"B\",\"c\":\"C\",\"d\":\"D\",\"e\":\"E\",\"f\":\"F\",\"g\":\"G\",\"h\"\
      :\"H\",\"i\":\"I\",\"j\":\"J\",\"k\":\"K\",\"l\":\"L\",\"m\":\"M\",\"n\":\"\
      N\",\"o\":\"O\",\"p\":\"P\",\"q\":\"Q\",\"r\":\"R\",\"s\":\"S\",\"t\":\"T\"\
      ,\"u\":\"U\",\"v\":\"V\",\"w\":\"W\",\"x\":\"X\",\"y\":\"Y\",\"z\":\"Z\"}\n\
      \    recognized = False\n    for alias in aliases:\n        for offset in range(len(name)):\n\
      \            candidate = name[offset:][:len(alias)]\n            if len(candidate)\
      \ != len(alias): continue\n            match = True\n            for i in range(len(alias)):\n\
      \                expected = alias[i]\n                actual = candidate[i]\n\
      \                if expected in uppercase:\n                    if actual !=\
      \ expected and actual != uppercase[expected]:\n                        match\
      \ = False\n                        break\n                elif actual != expected:\n\
      \                    match = False\n                    break\n            if\
      \ match: recognized = True\n    if not recognized: return reject(\"GPU name\
      \ is not recognized as gfx1151 family\")\n    return {\"GPU_COUNT\": 1, \"TP_SIZE\"\
      : 1}\n"
  api:
    health_endpoint: /health
    operations:
    - type: openai.chat
      endpoint: /v1/chat/completions
      mode: stream
  seed_spec: bf16-vllm-nvidia-general
  display_name_zh_cn: BF16 · vLLM · AMD gfx1151
  display_name_en: BF16 · vLLM · AMD gfx1151
