model_id: qwen/qwen3-0.6b
specs:
- name: bf16-vllm-amd395-gfx1151-local
  scenario: balanced
  engine: vllm
  image: __AMD395_VLLM_IMAGE_MAPPING_REQUIRED__:required
  gpus:
    vendor: amd
    name: ([Rr][Aa][Dd][Ee][Oo][Nn] 8060[Ss]|[Rr][Yy][Zz][Ee][Nn] [Aa][Ii] [Mm][Aa][Xx]\+?
      395|[Gg][Pp][Uu] 0[xX]1586 \([Gg][Ff][Xx]1151\))
    arch_id: gfx1151
  entrypoint:
  - vllm
  - serve
  args:
  - --dtype
  - bfloat16
  - --max-model-len
  - '4096'
  - --max-num-seqs
  - '1'
  - --gpu-memory-utilization
  - '0.25'
  - --enforce-eager
  env:
    VLLM_ROCM_USE_AITER: '0'
  placement:
    language: starlark
    resolver: "def resolve(gpu):\n    if gpu.vendor != \"amd\" or gpu.count != 1:\
      \ return reject(\"requires one AMD gfx1151-family GPU\")\n    return {\"GPU_COUNT\"\
      : 1, \"TP_SIZE\": 1}\n"
  api:
    health_endpoint: /health
    operations:
    - type: openai.chat
      endpoint: /v1/chat/completions
      mode: stream
  seed_spec: bf16-sglang-nvidia-general
  display_name_zh_cn: BF16 · vLLM · AMD gfx1151
  display_name_en: BF16 · vLLM · AMD gfx1151
- name: bf16-sglang-amd395-gfx1151-local
