models:
  - model_id: gpuworks/browser-e2e
    display_title: Browser E2E
    input_modalities:
      - text
    architecture: Qwen2ForCausalLM
    context_length: 4096
    parameter_count: 4096
    release_date: 2026-09-01
    specs:
      - name: browser-e2e-general
        display_profile: general
        scenario: balanced
        engine: vllm
        image: gpuworks/fake-engine:test
        weights:
          quantization: fp16
          sources:
            - huggingface:
                repo_id: gpuworks/browser-e2e
                revision: main
        weight_bytes: 1048576
        gpus:
          vendor: nvidia
          name: A100
          display_target: nvidia
        args: []
        env: {}
        api:
          health_endpoint: /health
          operations:
            - type: openai.chat
              endpoint: /v1/chat/completions
              mode: stream
            - type: openai.embeddings
              endpoint: /v1/embeddings
              mode: sync
            - type: openai.rerank
              endpoint: /v1/rerank
              mode: sync
            - type: openai.audio.transcribe
              endpoint: /v1/audio/transcriptions
              mode: sync
            - type: openai.audio.speech
              endpoint: /v1/audio/speech
              mode: sync
            - type: openai.image.generate
              endpoint: /v1/images/generations
              mode: sync
            - type: openai.video.generate
              endpoint: /v1/videos
              mode: async
