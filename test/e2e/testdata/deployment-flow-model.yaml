model_id: gpuworks/deployment-browser-e2e
source: user
display_title: Deployment Browser E2E
architecture: Qwen3ForCausalLM
input_modalities: [text]
context_length: 4096
model_config:
  model_type: qwen3
  architectures: [Qwen3ForCausalLM]
  max_position_embeddings: 4096
  num_hidden_layers: 2
  hidden_size: 64
  num_attention_heads: 4
  num_key_value_heads: 4
  torch_dtype: bfloat16
specs:
  - name: browser-vllm
    display_profile: general
    scenario: balanced
    engine: vllm
    image: gpuworks/browser-vllm:test
    weights:
      quantization: bf16
      sources:
        - huggingface: gpuworks/deployment-browser-e2e
    weight_bytes: 1048576
    gpus:
      vendor: nvidia
      name: H100
      display_target: nvidia
    args: [--dtype, bfloat16]
    env:
      TEMPLATE_MARK: from-vllm
  - name: browser-sglang
    display_profile: general
    scenario: balanced
    engine: sglang
    image: gpuworks/browser-sglang:test
    weights:
      quantization: bf16
      sources:
        - huggingface: gpuworks/deployment-browser-e2e
    weight_bytes: 1048576
    gpus:
      vendor: nvidia
      name: H100
      display_target: nvidia
    args: [--dtype, bfloat16]
    env:
      TEMPLATE_MARK: from-sglang
