# The documentation site build, the GitHub counterpart of docs-build in
# .gitlab-ci.yml: pull requests that touch the docs, and the release workflow
# (which prints the handbooks from this tree) through workflow_call.
#
# The OINK theme lives in a private repository. The WEBSITE_REPO secret holds
# a clone URL carrying a read-only token. Secrets do not reach pull requests
# from forks, so those run every check that needs no theme (build.sh --check:
# site tests, translation review, staging) and skip the site build; Read the
# Docs still renders the themed site for them. Every other run needs the
# secret and fails without it, so a release cannot ship without the site.
name: docs

on:
  pull_request:
    paths:
      - docs/**
      - docs-en/**
      - docs-site/**
      - requirements-e2e.txt
      - .github/workflows/docs.yml
  workflow_dispatch:
  workflow_call:
    secrets:
      WEBSITE_REPO:
        required: false

permissions:
  contents: read

env:
  HUGO_VERSION: "0.165.0"

jobs:
  docs-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Hugo
        run: |
          base=https://github.com/gohugoio/hugo/releases/download/v$HUGO_VERSION
          name=hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 5 -o "$name" "$base/$name"
          curl -fsSL --retry 5 -o checksums.txt "$base/hugo_${HUGO_VERSION}_checksums.txt"
          grep " $name\$" checksums.txt | sha256sum -c -
          tar -xzf "$name" hugo
          echo "HUGO_BIN=$RUNNER_TEMP/hugo" >> "$GITHUB_ENV"
      - name: Build the site
        id: build
        env:
          WEBSITE_REPO: ${{ secrets.WEBSITE_REPO }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -n "$WEBSITE_REPO" ]; then
            docs-site/build.sh
            echo "built=true" >> "$GITHUB_OUTPUT"
          elif [ "$FORK_PR" = "true" ]; then
            echo "::notice title=Site not built::pull requests from forks get no WEBSITE_REPO secret, so the themed site is not rendered here; Read the Docs renders it"
            docs-site/build.sh --check
          else
            echo "the WEBSITE_REPO secret (the OINK theme's clone URL) is not available to this run" >&2
            exit 1
          fi
      - if: steps.build.outputs.built == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: docs-site-public
          path: docs-site/public/
          retention-days: 30
