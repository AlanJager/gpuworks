# golangci-lint configuration. Run: golangci-lint run
run:
  timeout: 5m
  tests: true

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - gofmt
    - goimports
    - revive
    - bodyclose
    - nilerr

linters-settings:
  goimports:
    local-prefixes: gpuworks.ai/gpuworks
  revive:
    rules:
      - name: exported
        disabled: false

issues:
  exclude-rules:
    # Test files may be looser about error checks and long funcs.
    - path: _test\.go
      linters:
        - errcheck
        - bodyclose
